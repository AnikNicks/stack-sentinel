version: v2
agent: change-impact-synthesizer
created: '2025-02-03'
changelog: Requires the change_event to plausibly explain the specific finding (not
  just co-occur in the same cycle) before calling it attributable. Reduces false positives
  on routine, unrelated layer changes that v1 misread as evidence of real drift.
prompt_file: .claude/agents/change-impact-synthesizer.md
tool_scope:
- get_trend_history
model: claude-sonnet-4-20250514
objective_statement: Judge whether this cycle's finding is attributable to a real
  layer-change event or is noise, in the context of prior cycles.
