name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run framework-free fallback suite
        run: python tests/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the live console frontend
        working-directory: dashboard/web
        run: npm install && npm run build

      - name: Build the company demo apps
        run: |
          for d in companies/*/; do
            (cd "$d" && npm install && npm run build)
          done
