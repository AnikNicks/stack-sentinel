name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Only the 3 static company demo apps are Pages-deployable — dashboard/api is a real
      # FastAPI backend and can't be hosted on static Pages, so the live console is not part
      # of this workflow. Deploying any of this is an explicit, later, user-approved step;
      # this workflow just keeps the build itself honest and not broken.
      - name: Build the company demo apps
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html><html><body>
          <h1>Stack Sentinel — company demos</h1>
          <ul>
            <li><a href="meridian-labs/">Meridian Concierge</a></li>
            <li><a href="wayfinder-ai/">Wayfinder Copilot</a></li>
            <li><a href="cascade-analytics/">Cascade Pipeline Agent</a></li>
          </ul>
          </body></html>
          EOF
          for d in companies/*/; do
            name=$(basename "$d")
            (cd "$d" && npm install && npm run build)
            mkdir -p "_site/$name"
            cp -r "$d/dist/." "_site/$name/"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
