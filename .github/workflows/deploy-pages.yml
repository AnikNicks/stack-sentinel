name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # dashboard/api is a real FastAPI backend with a real write action and can't be hosted
      # on static Pages, so the LIVE console is not part of this workflow. What IS deployed at
      # the root is dashboard/web built in static-preview mode (VITE_STATIC_MODE=true): it
      # reads a bundled read-only snapshot of one real simulation run instead of calling a
      # live backend, and its api.js rejects the write/decision and live-LLM Ask calls with a
      # clear "not available in this preview" message rather than silently no-oping. --base
      # matches this repo's Pages subpath so the built asset URLs resolve correctly.
      #
      # The 3 company demo apps are NOT built here — each already has its own standalone repo
      # and Pages site (aniknicks.github.io/<company>/, correctly base-pathed there); the
      # dashboard's Companies tab links out to them directly (see COMPANY_DEMO_URLS in
      # dashboard/web/src/App.jsx) rather than this workflow deploying a second, redundant copy.
      - name: Build the dashboard (static preview)
        run: |
          mkdir -p _site
          (cd dashboard/web && npm install && VITE_STATIC_MODE=true npm run build -- --base=/stack-sentinel/)
          cp -r dashboard/web/dist/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
